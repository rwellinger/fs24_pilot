<!DOCTYPE html>
<html>
<!--
    Dev preview of the toolbar panel in a desktop browser — not part of the package.
    Loads the real panel CSS/JS from panel/package/ with stubs for the sim's TemplateElement
    and CommBus, and replays sample landings (sample_landings.js). Open the file directly,
    or `make preview` for screenshots. ?sample=<name> picks the landing shown at start.
-->
<head>
    <title>fs24 Pilot — panel preview</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../package/html_ui/InGamePanels/FS24Pilot/FS24Pilot.css" />
    <style>
        body { margin: 0; background: #2b2f38; font-family: "Segoe UI", Roboto, sans-serif; }
        #Picker { padding: 1vh; }
        #Picker button { margin-right: 0.5vh; }
        /* Stand-in for the sim's ingame-ui frame at a typical toolbar panel size. */
        #Frame { width: 44vh; height: 56vh; margin: 1vh; }
    </style>
    <script src="sim_stubs.js"></script>
    <script src="sample_landings.js"></script>
    <script src="../package/html_ui/InGamePanels/FS24Pilot/transport.js"></script>
    <script src="../package/html_ui/InGamePanels/FS24Pilot/view_model.js"></script>
    <script src="../package/html_ui/InGamePanels/FS24Pilot/landing_view.js"></script>
</head>
<body>
    <div id="Picker"></div>
    <fs24-pilot-panel id="FS24Pilot">
        <div id="Frame"><div id="Content"></div></div>
    </fs24-pilot-panel>
    <script src="../package/html_ui/InGamePanels/FS24Pilot/FS24Pilot.js"></script>
    <script src="picker.js"></script>
</body>
</html>
